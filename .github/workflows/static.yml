name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main  # or 'master' if that's your default branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-gateway:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install gateway build dependencies
        run: python -m pip install -r gateway/requirements.txt
      - name: Test gateway
        run: python -m unittest discover -s gateway -p test_gateway.py -v
      - name: Build Windows gateway
        run: |
          New-Item -ItemType Directory -Force gateway\.build | Out-Null
          python -m PyInstaller --onefile --name telnet-gateway --distpath gateway-dist --workpath "$env:RUNNER_TEMP\gateway-build" --specpath gateway\.build gateway\gateway.py
      - name: Upload Windows gateway
        uses: actions/upload-artifact@v4
        with:
          name: telnet-gateway-windows
          path: gateway-dist/telnet-gateway.exe
          if-no-files-found: error

  deploy:
    needs: build-gateway
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Windows gateway
        uses: actions/download-artifact@v4
        with:
          name: telnet-gateway-windows
          path: public/downloads

      - name: Build website
        run: npm run build

      - name: Prepare deployment files
        run: |
          mkdir site
          cp -r dist/* site/
          cp -r data site/data || true  # copy data folder if it exists

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
