<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Serial Console</title>
<style>
  :root{
    --bg:#f4f5f7;
    --panel-bg:#ffffff;
    --panel-border:#d7dae0;
    --text:#1b1f23;
    --muted:#6a737d;
    --accent:#2563eb;
    --accent-text:#ffffff;
    --danger:#d9342b;
    --danger-text:#ffffff;
    --console-bg:#0f1117;
    --console-text:#d9dde3;
    --console-in:#7fd1b9;
    --console-out:#f2c572;
    --meta-color:#8b93a1;
    --input-bg:#ffffff;
    --input-border:#c6cbd3;
    --modal-overlay:rgba(0,0,0,0.4);
  }
  html.dark{
    --bg:#15171c;
    --panel-bg:#1d2027;
    --panel-border:#32363f;
    --text:#e6e8eb;
    --muted:#9aa1ab;
    --accent:#3b82f6;
    --accent-text:#ffffff;
    --danger:#e5534b;
    --danger-text:#ffffff;
    --console-bg:#0b0d12;
    --console-text:#d9dde3;
    --console-in:#7fd1b9;
    --console-out:#f2c572;
    --meta-color:#8b93a1;
    --input-bg:#262a33;
    --input-border:#3c4149;
    --modal-overlay:rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header.topbar{
    flex:0 0 auto;
    display:flex;
    align-items:baseline;
    gap:16px;
    padding:10px 16px;
    background:var(--panel-bg);
    border-bottom:1px solid var(--panel-border);
  }
  header.topbar h1{
    font-size:18px;
    margin:0;
    flex:0 0 auto;
  }
  header.topbar .subtitle{
    flex:1 1 auto;
    text-align:right;
    font-size:12px;
    color:var(--muted);
  }
  .top-actions{
    display:flex;
    gap:8px;
    align-items:center;
    flex:0 0 auto;
  }
  button{
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    border:1px solid var(--input-border);
    background:var(--input-bg);
    color:var(--text);
    border-radius:6px;
    padding:6px 10px;
  }
  button:hover{filter:brightness(1.05);}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
  button.danger{background:var(--danger);color:var(--danger-text);border-color:var(--danger);}
  button.icon-btn{font-size:16px;padding:6px 8px;line-height:1;}
  input,select{
    font-family:inherit;
    font-size:13px;
    background:var(--input-bg);
    color:var(--text);
    border:1px solid var(--input-border);
    border-radius:5px;
    padding:5px 7px;
  }
  label{font-size:12px;color:var(--text);user-select:none;}

  #columnsContainer{
    display:grid;
    grid-auto-rows:1fr;
    align-items:stretch;
    gap:12px;
    padding:12px;
    overflow-x:auto;
    overflow-y:hidden;
    flex:1 1 auto;
    min-height:0;
  }
  .column{
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:8px;
    display:flex;
    flex-direction:column;
    min-width:320px;
    min-height:0;
    overflow:hidden;
  }
  .col-header{
    padding:8px 10px;
    border-bottom:1px solid var(--panel-border);
    display:flex;
    flex-wrap:nowrap;
    gap:6px;
    align-items:center;
  }
  .col-label{
    font-weight:600;
    width:110px;
    flex:0 0 auto;
  }
  .conn-info{
    font-size:11px;
    color:var(--muted);
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .port-settings-btn,
  .options-btn{
    flex:0 0 auto;
    white-space:nowrap;
  }
  .port-settings-btn::after,
  .options-btn::after{
    content:" ▾";
  }
  .port-settings-btn.open::after,
  .options-btn.open::after{
    content:" ▴";
  }
  .conn-settings-panel,
  .options-panel{
    border-bottom:1px solid var(--panel-border);
    padding:0 10px;
    max-height:0;
    overflow:hidden;
    transition:max-height 0.15s ease, padding 0.15s ease;
  }
  .conn-settings-panel.open,
  .options-panel.open{
    max-height:200px;
    padding:8px 10px;
  }
  .conn-settings-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:6px;
  }
  .conn-settings-grid .field{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .conn-settings-grid label{font-size:11px;color:var(--muted);}

  .send-row{
    display:flex;
    gap:6px;
    padding:8px 10px;
    border-bottom:1px solid var(--panel-border);
  }
  .send-row input{flex:1 1 auto;min-width:0;}

  .options-grid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }

  .toggle-btn{
    font-size:11px;
    padding:4px 10px;
    border-radius:14px;
  }
  .toggle-btn.active{
    background:var(--accent);
    color:var(--accent-text);
    border-color:var(--accent);
  }

  .console-toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
    padding:6px 10px;
    border-bottom:1px solid var(--panel-border);
  }
  .console-toolbar .autoscroll-btn{
    margin-left:auto;
  }
  .console-toolbar .options-btn{
    font-size:12px;
    padding:4px 8px;
  }
  .col-header,
  .conn-settings-panel,
  .send-row,
  .console-toolbar,
  .options-panel,
  .log-row{
    flex-shrink:0;
  }
  .console-wrapper{
    position:relative;
    flex:1 1 0;
    min-height:0;
    display:flex;
  }
  .hex-resizer{
    display:none;
    position:absolute;
    top:0;
    bottom:0;
    width:10px;
    cursor:col-resize;
    z-index:2;
  }
  .hex-resizer::after{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:1px;
    background:transparent;
    transform:translateX(-50%);
  }
  .hex-resizer:hover::after,
  .hex-resizer.dragging::after{
    background:var(--accent);
    width:2px;
  }
  .hex-resizer.visible{display:block;}
  .console{
    flex:1 1 auto;
    min-width:0;
    min-height:0;
    background:var(--console-bg);
    color:var(--console-text);
    font-family:"Consolas","SFMono-Regular",Menlo,monospace;
    font-size:12.5px;
    padding:8px 10px;
    overflow-y:auto;
    display:grid;
    grid-template-columns:max-content 1fr;
    column-gap:10px;
    row-gap:0;
    align-content:start;
  }
  /* Row spacing is padding inside each cell (not grid row-gap) so the
     divider borders stay continuous from one message to the next. */
  .console .meta-cell{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    color:var(--meta-color);
    white-space:pre;
    text-align:right;
    padding:1px 8px 1px 0;
    border-right:1px solid var(--panel-border);
  }
  .console .text-cell{
    white-space:pre-wrap;
    word-break:break-word;
    min-width:0;
    padding:1px 0;
  }
  .console .line-out .text-cell{color:var(--console-out);}
  .console .line-in .text-cell{color:var(--console-in);}
  .console .hex-cell{
    white-space:normal;
    word-break:normal;
    min-width:0;
    color:var(--muted);
    border-left:1px solid var(--panel-border);
    padding:1px 0 1px 8px;
  }
  .console .char-cell,
  .console .hex-byte{
    border-radius:2px;
  }
  .console .sync-hl{
    background-color:var(--accent) !important;
    color:var(--accent-text) !important;
  }

  .log-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    flex-wrap:wrap;
  }

  /* Scrollbars - themed to match light/dark mode; the console itself keeps
     a dark terminal background in both modes, so it gets its own variant. */
  ::-webkit-scrollbar{
    width:11px;
    height:11px;
  }
  ::-webkit-scrollbar-track{
    background:var(--panel-bg);
  }
  ::-webkit-scrollbar-thumb{
    background:var(--input-border);
    border-radius:6px;
    border:2px solid var(--panel-bg);
  }
  ::-webkit-scrollbar-thumb:hover{
    background:var(--muted);
  }
  .console::-webkit-scrollbar-track{
    background:var(--console-bg);
  }
  .console::-webkit-scrollbar-thumb{
    background:#3a3f4b;
    border-color:var(--console-bg);
  }
  .console::-webkit-scrollbar-thumb:hover{
    background:#4b5160;
  }
  html{
    scrollbar-width:thin;
    scrollbar-color:var(--input-border) var(--panel-bg);
  }

  /* Global settings modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:var(--modal-overlay);
    display:flex;
    align-items:flex-start;
    justify-content:flex-end;
    padding:60px 20px 0 0;
    z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  .modal{
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:8px;
    width:300px;
    padding:16px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .modal h2{margin:0 0 12px;font-size:15px;}
  .modal .field{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:12px;
  }
  .modal .field label{font-size:12px;color:var(--muted);}
  .modal .actions{
    display:flex;
    justify-content:flex-end;
    margin-top:4px;
  }
  .hint{
    flex:0 0 auto;
    font-size:11px;
    color:var(--muted);
    padding:0 16px 8px;
  }
</style>
</head>
<body>
<header class="topbar">
  <h1>Web Serial Console</h1>
  <div class="subtitle">Requires Chrome or Edge, served over HTTPS or localhost</div>
  <div class="top-actions">
    <button id="darkModeToggle" class="icon-btn" title="Toggle dark mode">🌙</button>
    <button id="globalSettingsBtn" class="icon-btn" title="Settings">⚙️</button>
  </div>
</header>
<div class="hint" id="supportHint"></div>

<div id="columnsContainer"></div>

<div id="globalSettingsOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h2>Console Settings</h2>
    <div class="field">
      <label for="g-ts-format">Timestamp format</label>
      <select id="g-ts-format">
        <option value="time">HH:MM:SS</option>
        <option value="time-ms">HH:MM:SS.mmm</option>
        <option value="iso">ISO 8601</option>
        <option value="unix">Unix epoch (ms)</option>
      </select>
    </div>
    <div class="field">
      <label for="g-buffer-size">Message buffer size (per column)</label>
      <input type="number" id="g-buffer-size" min="10" max="20000" step="10">
    </div>
    <div class="field">
      <label for="g-num-columns">Number of columns</label>
      <input type="number" id="g-num-columns" min="1" max="8" step="1">
    </div>
    <div class="actions">
      <button id="globalSettingsClose" class="primary">Close</button>
    </div>
  </div>
</div>

<template id="columnTemplate">
  <div class="column">
    <div class="col-header">
      <input class="col-label" type="text" title="Column label (used in log filenames)">
      <button class="connect-btn primary">Connect</button>
      <span class="conn-info"></span>
      <button class="port-settings-btn" type="button" title="Port settings">⚙ Port Settings</button>
    </div>
    <div class="conn-settings-panel">
      <div class="conn-settings-grid">
        <div class="field">
          <label>Baud rate</label>
          <input type="number" class="f-baud" list="baudPresets" min="1">
        </div>
        <div class="field">
          <label>Data bits</label>
          <select class="f-databits">
            <option value="8">8</option>
            <option value="7">7</option>
          </select>
        </div>
        <div class="field">
          <label>Stop bits</label>
          <select class="f-stopbits">
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </div>
        <div class="field">
          <label>Parity</label>
          <select class="f-parity">
            <option value="none">None</option>
            <option value="even">Even</option>
            <option value="odd">Odd</option>
          </select>
        </div>
        <div class="field">
          <label>Flow control</label>
          <select class="f-flow">
            <option value="none">None</option>
            <option value="hardware">Hardware</option>
          </select>
        </div>
      </div>
    </div>

    <div class="send-row">
      <input type="text" class="send-input" placeholder="Message to send...">
      <button class="send-btn">Send</button>
      <button class="send-char-btn" title="Sends only the first character of the input box, then removes it from the box">Send Char</button>
    </div>

    <div class="console-toolbar">
      <button class="options-btn" type="button" title="Send and display options">⚙ Send &amp; Display Options</button>
      <button class="autoscroll-btn toggle-btn" type="button" title="Toggle auto-scroll for new messages">⬇ Auto-scroll</button>
      <button class="hexview-btn toggle-btn" type="button" title="Split console into text + hex view">⬢ Hex View</button>
    </div>
    <div class="options-panel">
      <div class="options-grid">
        <button type="button" class="toggle-btn opt-cr">Send with \r</button>
        <button type="button" class="toggle-btn opt-lf">Send with \n</button>
        <button type="button" class="toggle-btn opt-hex">Parse \xHH hex escapes</button>
        <button type="button" class="toggle-btn opt-key" title="Key escape legend (backtick-delimited):&#10;`CTRL+C` &#8594; 0x03  (interrupt)&#10;`CTRL+D` &#8594; 0x04  (e.g. CircuitPython soft reboot)&#10;`CTRL+A` ... `CTRL+Z` &#8594; 0x01-0x1A&#10;`ESC` &#8594; 0x1B    `TAB` &#8594; 0x09&#10;`ENTER` / `CR` &#8594; 0x0D    `LF` &#8594; 0x0A&#10;`BACKSPACE` &#8594; 0x08    `DEL` &#8594; 0x7F&#10;`NUL` &#8594; 0x00    `SPACE` &#8594; 0x20&#10;Combine with +, e.g. `CTRL+ALT+DEL`&#10;(Alt/Shift/Meta are accepted but have no serial effect)">Parse `KEY` escapes ⓘ</button>
        <button type="button" class="toggle-btn opt-ts">Show timestamps</button>
        <button type="button" class="toggle-btn opt-out">Show outgoing data</button>
        <button type="button" class="toggle-btn opt-num">Show message number</button>
      </div>
    </div>

    <div class="console-wrapper">
      <div class="console"></div>
      <div class="hex-resizer" title="Drag to resize the hex view"></div>
    </div>

    <div class="log-row">
      <button class="log-btn">Start Logging</button>
      <button type="button" class="toggle-btn log-meta-btn">Include metadata in log</button>
      <button type="button" class="toggle-btn log-prior-btn" title="When starting, also save messages already in the buffer (received before logging started)">Include buffered history</button>
    </div>
  </div>
</template>

<datalist id="baudPresets">
  <option value="300"></option>
  <option value="1200"></option>
  <option value="2400"></option>
  <option value="4800"></option>
  <option value="9600"></option>
  <option value="14400"></option>
  <option value="19200"></option>
  <option value="38400"></option>
  <option value="57600"></option>
  <option value="115200"></option>
  <option value="230400"></option>
  <option value="460800"></option>
  <option value="921600"></option>
</datalist>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------------
   * Cookie helpers - all serial port settings and UI preferences persist
   * here so the layout/config is restored on the next visit.
   * ------------------------------------------------------------------- */
  function setCookie(name, value, days){
    days = days || 400;
    const d = new Date();
    d.setTime(d.getTime() + days * 86400000);
    document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ";path=/;SameSite=Lax";
  }
  function getCookie(name){
    const escaped = name.replace(/[.$?*|{}()[\]\\/+^]/g, "\\$&");
    const match = document.cookie.match(new RegExp("(?:^|; )" + escaped + "=([^;]*)"));
    return match ? decodeURIComponent(match[1]) : null;
  }
  function setJSONCookie(name, obj){ setCookie(name, JSON.stringify(obj)); }
  function getJSONCookie(name){
    const raw = getCookie(name);
    if(!raw) return null;
    try { return JSON.parse(raw); } catch(e){ return null; }
  }

  const MAX_COLUMNS = 8;

  /* ---------------------------------------------------------------------
   * Global settings
   * ------------------------------------------------------------------- */
  const DEFAULT_GLOBAL = { numColumns: 2, bufferSize: 500, tsFormat: "time-ms", darkMode: true };
  const global = Object.assign({}, DEFAULT_GLOBAL, getJSONCookie("wsc_global") || {});

  function saveGlobalSettings(){ setJSONCookie("wsc_global", global); }

  function applyTheme(){
    document.documentElement.classList.toggle("dark", !!global.darkMode);
    document.getElementById("darkModeToggle").textContent = global.darkMode ? "☀️" : "🌙";
  }

  /* ---------------------------------------------------------------------
   * Per-column settings + runtime state
   * ------------------------------------------------------------------- */
  function defaultColumnSettings(index){
    return {
      label: "Port " + (index + 1),
      baud: 9600,
      dataBits: 8,
      stopBits: 1,
      parity: "none",
      flowControl: "none",
      sendCR: false,
      sendLF: true,
      hexEscape: false,
      keyEscape: false,
      showTimestamps: true,
      showOutgoing: true,
      showMsgNum: false,
      logMetadata: true,
      logIncludeBuffered: false,
      optionsOpen: false,
      autoScroll: true,
      hexView: false,
      hexViewWidth: 170
    };
  }
  function loadColumnSettings(index){
    const saved = getJSONCookie("wsc_col_" + index);
    return Object.assign(defaultColumnSettings(index), saved || {});
  }
  function saveColumnSettings(index, settings){
    setJSONCookie("wsc_col_" + index, settings);
  }

  function createColumnState(index){
    return {
      index: index,
      settings: loadColumnSettings(index),
      port: null,
      reader: null,
      writer: null,
      connected: false,
      messages: [],
      counter: 0,
      logging: false,
      logLines: [],
      logStart: null
    };
  }

  const state = { columns: [] };

  /* ---------------------------------------------------------------------
   * Formatting helpers
   * ------------------------------------------------------------------- */
  function pad(n, len){ len = len || 2; return String(n).padStart(len, "0"); }

  function formatTimestamp(date){
    switch(global.tsFormat){
      case "time": return pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
      case "iso": return date.toISOString();
      case "unix": return String(date.getTime());
      case "time-ms":
      default:
        return pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds()) + "." + pad(date.getMilliseconds(), 3);
    }
  }

  function sanitizeFilename(s){ return (s || "port").replace(/[^a-z0-9_\-]/gi, "_"); }

  function formatFileTimestamp(date){
    return date.getFullYear() + pad(date.getMonth() + 1) + pad(date.getDate()) + "_" +
      pad(date.getHours()) + pad(date.getMinutes()) + pad(date.getSeconds());
  }

  // Builds the {meta, text} parts for one message given a settings object.
  // Returns null if the message should not be shown at all (hidden outgoing data).
  function buildDisplayParts(msg, settings){
    if(msg.type === "out" && !settings.showOutgoing) return null;
    const metaParts = [];
    if(settings.showMsgNum) metaParts.push("#" + msg.num);
    if(settings.showTimestamps) metaParts.push(formatTimestamp(msg.time));
    let meta = metaParts.join(" ");
    if(settings.showOutgoing){
      const arrow = msg.type === "out" ? "->" : "<-";
      meta = meta ? (meta + " " + arrow) : arrow;
    }
    return { meta: meta, text: msg.text };
  }

  /* ---------------------------------------------------------------------
   * Hex/key escape aware text encoding for outgoing data.
   * Literal text is UTF-8 encoded; "\xHH" tokens become a single raw byte;
   * `KEY` tokens (backtick-delimited) resolve to control-code bytes, e.g.
   * "AT+TEST\x0D\x0A" sends ASCII text followed by raw CR LF bytes, and
   * "`CTRL+D`" sends the single byte 0x04 (CircuitPython soft reboot).
   * ------------------------------------------------------------------- */
  const CTRL_SYMBOL_MAP = { "@": 0x00, "[": 0x1B, "\\": 0x1C, "]": 0x1D, "^": 0x1E, "_": 0x1F, "?": 0x7F };
  const NAMED_KEY_MAP = {
    ENTER: 0x0D, RETURN: 0x0D, CR: 0x0D,
    LF: 0x0A, NEWLINE: 0x0A, LINEFEED: 0x0A,
    TAB: 0x09,
    ESC: 0x1B, ESCAPE: 0x1B,
    SPACE: 0x20,
    BACKSPACE: 0x08, BS: 0x08,
    DEL: 0x7F, DELETE: 0x7F,
    NUL: 0x00, NULL: 0x00
  };

  // Resolves one '+'-joined key combo token (e.g. "CTRL+D", "CTRL+ALT+DEL",
  // "ESC") to a single byte value, or null if unrecognized. Alt/Shift/Meta
  // modifiers are accepted for readability but have no byte-level effect -
  // there is no standard serial encoding for them, so they're ignored and
  // the base key (if any) is still resolved on its own.
  function resolveKeyCombo(token){
    const parts = token.split("+").map(function(p){ return p.trim().toUpperCase(); }).filter(Boolean);
    if(!parts.length) return null;
    let ctrl = false, base = null;
    parts.forEach(function(p){
      if(p === "CTRL" || p === "CONTROL") ctrl = true;
      else if(p === "ALT" || p === "SHIFT" || p === "META" || p === "CMD" || p === "WIN" || p === "OPTION"){ /* no serial equivalent */ }
      else base = p;
    });
    if(base === null) return null;
    if(ctrl){
      if(/^[A-Z]$/.test(base)) return base.charCodeAt(0) - 64;
      if(base === "SPACE") return 0x00;
      if(CTRL_SYMBOL_MAP.hasOwnProperty(base)) return CTRL_SYMBOL_MAP[base];
      // Unknown Ctrl combination (e.g. CTRL+ALT+DEL) - fall through and
      // resolve the base key on its own instead of failing outright.
    }
    if(NAMED_KEY_MAP.hasOwnProperty(base)) return NAMED_KEY_MAP[base];
    if(/^[A-Z0-9]$/.test(base)) return base.charCodeAt(0);
    return null;
  }

  function parseOutgoingText(text, hexEscape, keyEscape){
    const encoder = new TextEncoder();
    if(!hexEscape && !keyEscape) return encoder.encode(text);
    const bytes = [];
    let i = 0;
    while(i < text.length){
      if(hexEscape && text[i] === "\\" && text[i + 1] === "x" && /^[0-9a-fA-F]{2}/.test(text.slice(i + 2, i + 4))){
        bytes.push(parseInt(text.slice(i + 2, i + 4), 16));
        i += 4;
        continue;
      }
      if(keyEscape && text[i] === "`"){
        const end = text.indexOf("`", i + 1);
        if(end !== -1){
          const code = resolveKeyCombo(text.slice(i + 1, end));
          if(code !== null){
            bytes.push(code);
            i = end + 1;
            continue;
          }
        }
      }
      // Literal character - advance by one code point so surrogate-pair
      // characters (e.g. emoji) are encoded correctly as a single unit.
      const char = String.fromCodePoint(text.codePointAt(i));
      bytes.push.apply(bytes, encoder.encode(char));
      i += char.length;
    }
    return new Uint8Array(bytes);
  }

  /* ---------------------------------------------------------------------
   * ANSI escape code rendering.
   * Converts SGR (color/style) escape sequences into styled <span>s and
   * silently drops other CSI control sequences (cursor movement, clear,
   * etc.) that have no meaningful rendering in a scrolling log.
   * ------------------------------------------------------------------- */
  const ANSI_FG = {
    30:"#2e3436",31:"#cc0000",32:"#4e9a06",33:"#c4a000",34:"#3465a4",35:"#75507b",36:"#06989a",37:"#d3d7cf",
    90:"#555753",91:"#ef2929",92:"#8ae234",93:"#fce94f",94:"#729fcf",95:"#ad7fa8",96:"#34e2e2",97:"#eeeeec"
  };
  const ANSI_BASE16 = ["#000000","#cc0000","#4e9a06","#c4a000","#3465a4","#75507b","#06989a","#d3d7cf",
    "#555753","#ef2929","#8ae234","#fce94f","#729fcf","#ad7fa8","#34e2e2","#eeeeec"];

  function ansi256(n){
    n = Number(n) || 0;
    if(n < 16) return ANSI_BASE16[n];
    if(n >= 232){ const v = 8 + (n - 232) * 10; return "rgb(" + v + "," + v + "," + v + ")"; }
    n -= 16;
    const r = Math.floor(n / 36), g = Math.floor((n % 36) / 6), b = n % 6;
    const levels = [0, 95, 135, 175, 215, 255];
    return "rgb(" + levels[r] + "," + levels[g] + "," + levels[b] + ")";
  }

  function escapeHtml(s){
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function freshAnsiState(){
    return { fg: null, bg: null, bold: false, dim: false, italic: false, underline: false, strike: false, inverse: false };
  }

  function ansiStyleString(state){
    let fg = state.fg, bg = state.bg;
    if(state.inverse){
      const t = fg; fg = bg || "var(--console-bg)"; bg = t || "var(--console-text)";
    }
    const styles = [];
    if(fg) styles.push("color:" + fg);
    if(bg) styles.push("background-color:" + bg);
    if(state.bold) styles.push("font-weight:bold");
    if(state.dim) styles.push("opacity:0.65");
    if(state.italic) styles.push("font-style:italic");
    if(state.underline && state.strike) styles.push("text-decoration:underline line-through");
    else if(state.underline) styles.push("text-decoration:underline");
    else if(state.strike) styles.push("text-decoration:line-through");
    return styles.join(";");
  }

  // Mutates `state` in place according to one SGR parameter list (the part
  // between "\x1b[" and the final "m"). Shared by the fast innerHTML
  // renderer and the per-character renderer used for hex-view sync.
  function applySgrParams(state, paramsStr){
    const codes = paramsStr.length ? paramsStr.split(";").map(Number) : [0];
    let idx = 0;
    while(idx < codes.length){
      const code = codes[idx];
      if(code === 0) Object.assign(state, freshAnsiState());
      else if(code === 1) state.bold = true;
      else if(code === 2) state.dim = true;
      else if(code === 3) state.italic = true;
      else if(code === 4) state.underline = true;
      else if(code === 7) state.inverse = true;
      else if(code === 9) state.strike = true;
      else if(code === 22){ state.bold = false; state.dim = false; }
      else if(code === 23) state.italic = false;
      else if(code === 24) state.underline = false;
      else if(code === 27) state.inverse = false;
      else if(code === 29) state.strike = false;
      else if(code >= 30 && code <= 37) state.fg = ANSI_FG[code];
      else if(code === 38){
        if(codes[idx + 1] === 5){ state.fg = ansi256(codes[idx + 2]); idx += 2; }
        else if(codes[idx + 1] === 2){ state.fg = "rgb(" + codes[idx + 2] + "," + codes[idx + 3] + "," + codes[idx + 4] + ")"; idx += 4; }
      }
      else if(code === 39) state.fg = null;
      else if(code >= 40 && code <= 47) state.bg = ANSI_FG[code - 10];
      else if(code === 48){
        if(codes[idx + 1] === 5){ state.bg = ansi256(codes[idx + 2]); idx += 2; }
        else if(codes[idx + 1] === 2){ state.bg = "rgb(" + codes[idx + 2] + "," + codes[idx + 3] + "," + codes[idx + 4] + ")"; idx += 4; }
      }
      else if(code === 49) state.bg = null;
      else if(code >= 90 && code <= 97) state.fg = ANSI_FG[code];
      else if(code >= 100 && code <= 107) state.bg = ANSI_FG[code - 10];
      idx++;
    }
  }

  // Converts raw text that may contain ANSI escape sequences into safe HTML
  // with inline styles reflecting the accumulated SGR (color/style) state.
  function ansiToHtml(input){
    if(input.indexOf("\x1b") === -1) return escapeHtml(input);
    const CSI_RE = /\x1b\[([0-9;]*)([A-Za-z])/g;
    let result = "", lastIndex = 0, spanOpen = false, state = freshAnsiState(), match;
    while((match = CSI_RE.exec(input))){
      const literal = input.slice(lastIndex, match.index);
      if(literal) result += escapeHtml(literal);
      lastIndex = CSI_RE.lastIndex;
      if(match[2] === "m"){
        if(spanOpen){ result += "</span>"; spanOpen = false; }
        applySgrParams(state, match[1]);
        const styleStr = ansiStyleString(state);
        if(styleStr){ result += '<span style="' + styleStr + '">'; spanOpen = true; }
      }
      // Non-SGR CSI sequences (cursor movement, clear screen, etc.) are dropped.
    }
    const rest = input.slice(lastIndex);
    if(rest) result += escapeHtml(rest);
    if(spanOpen) result += "</span>";
    return result;
  }

  /* ---------------------------------------------------------------------
   * Byte-synced rendering (used only when hex view is on) - each visible
   * character in the text-cell and each byte in the hex-cell is wrapped in
   * its own <span data-b0 data-b1> so that selecting a range in either cell
   * can look up and highlight the corresponding byte range in the other.
   * ------------------------------------------------------------------- */
  function buildCharByteMap(text){
    const encoder = new TextEncoder();
    const map = new Array(text.length);
    let byteOffset = 0;
    for(let k = 0; k < text.length; k++){
      const len = encoder.encode(text[k]).length;
      map[k] = { byteStart: byteOffset, byteEnd: byteOffset + len };
      byteOffset += len;
    }
    return map;
  }

  function appendCharSpan(container, ch, byteRange, styleStr){
    const span = document.createElement("span");
    span.className = "char-cell";
    if(byteRange){
      span.dataset.b0 = byteRange.byteStart;
      span.dataset.b1 = byteRange.byteEnd;
    }
    if(styleStr) span.setAttribute("style", styleStr);
    span.textContent = ch;
    container.appendChild(span);
  }

  function renderTextCellSynced(textCell, text, charByteMap){
    textCell.innerHTML = "";
    if(text.indexOf("\x1b") === -1){
      for(let ci = 0; ci < text.length; ci++){
        appendCharSpan(textCell, text[ci], charByteMap[ci]);
      }
      return;
    }
    const CSI_RE = /\x1b\[([0-9;]*)([A-Za-z])/g;
    let lastIndex = 0, state = freshAnsiState(), match;
    while((match = CSI_RE.exec(text))){
      const styleStr = ansiStyleString(state);
      for(let ci = lastIndex; ci < match.index; ci++){
        appendCharSpan(textCell, text[ci], charByteMap[ci], styleStr);
      }
      lastIndex = CSI_RE.lastIndex;
      if(match[2] === "m") applySgrParams(state, match[1]);
      // Non-SGR CSI sequences are consumed (bytes skipped) but render nothing.
    }
    const styleStr = ansiStyleString(state);
    for(let ci = lastIndex; ci < text.length; ci++){
      appendCharSpan(textCell, text[ci], charByteMap[ci], styleStr);
    }
  }

  function renderHexCellSynced(hexCell, bytes){
    hexCell.innerHTML = "";
    if(!bytes || !bytes.length) return;
    // Bytes are separated by plain spaces (no hard line breaks) so the
    // browser reflows them to whatever width the hex column is dragged to.
    for(let k = 0; k < bytes.length; k++){
      if(k > 0) hexCell.appendChild(document.createTextNode(" "));
      const span = document.createElement("span");
      span.className = "hex-byte";
      span.dataset.b0 = k;
      span.dataset.b1 = k + 1;
      span.textContent = bytes[k].toString(16).padStart(2, "0").toUpperCase();
      hexCell.appendChild(span);
    }
  }

  /* ---------------------------------------------------------------------
   * Rendering
   * ------------------------------------------------------------------- */
  function colRoot(i){ return document.querySelector('.column[data-index="' + i + '"]'); }

  function renderLine(i, msg){
    const col = state.columns[i];
    const root = colRoot(i);
    if(!root) return;
    const parts = buildDisplayParts(msg, col.settings);
    if(!parts){ msg.el = null; return; }
    const consoleEl = root.querySelector(".console");

    // A display:contents wrapper lets each message's cells become direct
    // grid items of .console, so every row shares the same column widths -
    // this keeps the text (and hex) columns aligned regardless of how wide
    // any individual row's metadata is, and keeps wrapped/multi-line text
    // (e.g. embedded \r\n) indented under the text column, not the meta.
    const wrap = document.createElement("div");
    wrap.className = "line-wrap line-" + msg.type;
    wrap.style.display = "contents";

    const metaCell = document.createElement("span");
    metaCell.className = "meta-cell";
    metaCell.textContent = parts.meta;
    wrap.appendChild(metaCell);

    const textCell = document.createElement("span");
    textCell.className = "text-cell";
    if(col.settings.hexView){
      renderTextCellSynced(textCell, parts.text, buildCharByteMap(parts.text));
    } else {
      textCell.innerHTML = ansiToHtml(parts.text);
    }
    wrap.appendChild(textCell);

    if(col.settings.hexView){
      const hexCell = document.createElement("span");
      hexCell.className = "hex-cell";
      renderHexCellSynced(hexCell, msg.bytes);
      wrap.appendChild(hexCell);
    }

    consoleEl.appendChild(wrap);
    msg.el = wrap;
    if(col.settings.hexView) scheduleLayout(i);
    if(col.settings.autoScroll){
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }
  }

  // New rows can widen the metadata column or add a scrollbar, both of which
  // shift the hex handle - re-sync at most once per frame.
  const layoutPending = {};
  function scheduleLayout(i){
    if(layoutPending[i]) return;
    layoutPending[i] = true;
    requestAnimationFrame(function(){
      layoutPending[i] = false;
      if(state.columns[i]) updateConsoleLayout(i);
    });
  }

  const HEX_MIN_WIDTH = 80;
  const TEXT_MIN_WIDTH = 80;

  // Largest hex-column width that still leaves room for the metadata column
  // and a minimally usable text column (console padding 20px + two 10px gaps).
  function maxHexWidth(i){
    const root = colRoot(i);
    const consoleEl = root.querySelector(".console");
    const meta = consoleEl.querySelector(".meta-cell");
    const metaWidth = meta ? meta.getBoundingClientRect().width : 0;
    return Math.max(HEX_MIN_WIDTH, consoleEl.clientWidth - 20 - 20 - metaWidth - TEXT_MIN_WIDTH);
  }

  function effectiveHexWidth(i){
    return Math.max(HEX_MIN_WIDTH, Math.min(state.columns[i].settings.hexViewWidth, maxHexWidth(i)));
  }

  function updateConsoleLayout(i){
    const col = state.columns[i];
    const root = colRoot(i);
    if(!root) return;
    const consoleEl = root.querySelector(".console");
    const resizer = root.querySelector(".hex-resizer");
    if(col.settings.hexView){
      const hexWidth = effectiveHexWidth(i);
      consoleEl.style.gridTemplateColumns = "max-content 1fr " + hexWidth + "px";
      if(resizer){
        resizer.classList.add("visible");
        // Center the 10px handle on the hex column's left edge, accounting for
        // the console's right padding (10px) and any vertical scrollbar.
        const scrollbarWidth = consoleEl.parentElement.clientWidth - consoleEl.clientWidth;
        resizer.style.right = (scrollbarWidth + hexWidth + 5) + "px";
      }
    } else {
      consoleEl.style.gridTemplateColumns = "max-content 1fr";
      if(resizer) resizer.classList.remove("visible");
    }
  }

  function renderConsole(i){
    const col = state.columns[i];
    const root = colRoot(i);
    if(!root) return;
    const consoleEl = root.querySelector(".console");
    updateConsoleLayout(i);
    consoleEl.innerHTML = "";
    col.messages.forEach(function(msg){ renderLine(i, msg); });
  }

  function renderAllConsoles(){
    state.columns.forEach(function(_, i){ renderConsole(i); });
  }

  /* ---------------------------------------------------------------------
   * Hex-view selection sync - selecting a range of characters in a
   * text-cell highlights the overlapping byte(s) in that row's hex-cell,
   * and vice versa, via the data-b0/data-b1 byte-range attributes set on
   * each .char-cell/.hex-byte span by renderTextCellSynced/renderHexCellSynced.
   * ------------------------------------------------------------------- */
  let syncHlScheduled = false;

  function clearSyncHighlights(){
    document.querySelectorAll(".console .sync-hl").forEach(function(el){ el.classList.remove("sync-hl"); });
  }

  function highlightOverlapping(cell, selector, minByte, maxByte){
    cell.querySelectorAll(selector).forEach(function(span){
      if(span.dataset.b0 === undefined) return;
      const b0 = Number(span.dataset.b0), b1 = Number(span.dataset.b1);
      if(b0 < maxByte && b1 > minByte) span.classList.add("sync-hl");
    });
  }

  function collectSelectedByteRange(cell, selector, range){
    let minByte = Infinity, maxByte = -Infinity, found = false;
    cell.querySelectorAll(selector).forEach(function(span){
      if(span.dataset.b0 === undefined) return;
      if(range.intersectsNode(span)){
        found = true;
        minByte = Math.min(minByte, Number(span.dataset.b0));
        maxByte = Math.max(maxByte, Number(span.dataset.b1));
      }
    });
    return found ? { minByte: minByte, maxByte: maxByte } : null;
  }

  function updateSyncHighlight(){
    clearSyncHighlights();
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);
    const anchorEl = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
    if(!anchorEl) return;
    const consoleEl = anchorEl.closest(".console");
    if(!consoleEl) return;
    const colEl = consoleEl.closest(".column");
    if(!colEl) return;
    const col = state.columns[Number(colEl.getAttribute("data-index"))];
    if(!col || !col.settings.hexView) return;

    consoleEl.querySelectorAll(".line-wrap").forEach(function(wrap){
      if(!range.intersectsNode(wrap)) return;
      const textCell = wrap.querySelector(".text-cell");
      const hexCell = wrap.querySelector(".hex-cell");
      if(!textCell || !hexCell) return;

      const fromText = collectSelectedByteRange(textCell, ".char-cell", range);
      if(fromText) highlightOverlapping(hexCell, ".hex-byte", fromText.minByte, fromText.maxByte);

      const fromHex = collectSelectedByteRange(hexCell, ".hex-byte", range);
      if(fromHex) highlightOverlapping(textCell, ".char-cell", fromHex.minByte, fromHex.maxByte);
    });
  }

  document.addEventListener("selectionchange", function(){
    if(syncHlScheduled) return;
    syncHlScheduled = true;
    requestAnimationFrame(function(){
      syncHlScheduled = false;
      updateSyncHighlight();
    });
  });

  function updateColumnUI(i){
    const col = state.columns[i];
    const root = colRoot(i);
    if(!root) return;
    const connectBtn = root.querySelector(".connect-btn");
    const infoEl = root.querySelector(".conn-info");
    const settingsFields = root.querySelectorAll(".f-baud,.f-databits,.f-stopbits,.f-parity,.f-flow");

    if(col.connected){
      connectBtn.textContent = "Disconnect";
      connectBtn.classList.remove("primary");
      connectBtn.classList.add("danger");
      const s = col.settings;
      const parityCode = s.parity === "even" ? "E" : (s.parity === "odd" ? "O" : "N");
      let info = s.baud + " " + s.dataBits + parityCode + s.stopBits;
      if(s.flowControl === "hardware") info += ", HW flow";
      if(col.port && col.port.getInfo){
        try{
          const pi = col.port.getInfo();
          if(pi && (pi.usbVendorId || pi.usbProductId)){
            info += " (VID:" + (pi.usbVendorId != null ? pi.usbVendorId.toString(16).padStart(4,"0") : "????") +
              " PID:" + (pi.usbProductId != null ? pi.usbProductId.toString(16).padStart(4,"0") : "????") + ")";
          }
        } catch(e){ /* getInfo not available in all browsers */ }
      }
      infoEl.textContent = info;
    } else {
      connectBtn.textContent = "Connect";
      connectBtn.classList.remove("danger");
      connectBtn.classList.add("primary");
      infoEl.textContent = "";
    }
    settingsFields.forEach(function(f){ f.disabled = col.connected; });
  }

  function updateToolbarButtons(i){
    const col = state.columns[i];
    const root = colRoot(i);
    if(!root) return;
    const asBtn = root.querySelector(".autoscroll-btn");
    const hvBtn = root.querySelector(".hexview-btn");
    asBtn.classList.toggle("active", col.settings.autoScroll);
    asBtn.setAttribute("aria-pressed", String(!!col.settings.autoScroll));
    hvBtn.classList.toggle("active", col.settings.hexView);
    hvBtn.setAttribute("aria-pressed", String(!!col.settings.hexView));
  }

  /* ---------------------------------------------------------------------
   * Messages
   * ------------------------------------------------------------------- */
  function appendMessage(i, type, text, bytes){
    const col = state.columns[i];
    col.counter += 1;
    const msg = { type: type, text: text, time: new Date(), num: col.counter, bytes: bytes || null, el: null };
    col.messages.push(msg);
    while(col.messages.length > global.bufferSize){
      const removed = col.messages.shift();
      if(removed.el && removed.el.parentNode) removed.el.parentNode.removeChild(removed.el);
    }
    renderLine(i, msg);
    if(col.logging) logMessage(i, msg);
  }

  function logMessage(i, msg){
    const col = state.columns[i];
    if(msg.type === "out" && !col.settings.showOutgoing) return;
    let line;
    if(col.settings.logMetadata){
      const parts = buildDisplayParts(msg, col.settings);
      if(!parts) return;
      line = parts.meta ? (parts.meta + " " + parts.text) : parts.text;
    } else {
      line = msg.text;
    }
    col.logLines.push(line);
  }

  /* ---------------------------------------------------------------------
   * Serial connection
   * ------------------------------------------------------------------- */
  async function connectColumn(i){
    const col = state.columns[i];
    if(!("serial" in navigator)){
      alert("The Web Serial API is not available in this browser. Please use Chrome or Edge over HTTPS (or localhost).");
      return;
    }
    try{
      const port = await navigator.serial.requestPort();
      const s = col.settings;
      await port.open({
        baudRate: Number(s.baud),
        dataBits: Number(s.dataBits),
        stopBits: Number(s.stopBits),
        parity: s.parity,
        flowControl: s.flowControl
      });
      col.port = port;
      col.connected = true;
      col.writer = port.writable.getWriter();
      updateColumnUI(i);
      readLoop(i);
    } catch(err){
      if(err && err.name !== "NotFoundError"){
        alert("Failed to connect: " + err.message);
      }
    }
  }

  async function disconnectColumn(i){
    const col = state.columns[i];
    col.connected = false;
    try{ if(col.reader){ await col.reader.cancel(); } } catch(e){}
    try{ if(col.writer){ await col.writer.close(); } } catch(e){}
    try{ if(col.port){ await col.port.close(); } } catch(e){}
    col.port = null;
    col.reader = null;
    col.writer = null;
    updateColumnUI(i);
  }

  async function readLoop(i){
    const col = state.columns[i];
    const decoder = new TextDecoder();
    const reader = col.port.readable.getReader();
    col.reader = reader;
    try{
      while(col.connected){
        const { value, done } = await reader.read();
        if(done) break;
        if(value && value.length){
          const text = decoder.decode(value, { stream: true });
          if(text) appendMessage(i, "in", text, value.slice());
        }
      }
    } catch(err){
      console.error("Read error on column " + i, err);
    } finally {
      try{ reader.releaseLock(); } catch(e){}
      if(col.connected){
        // Port dropped unexpectedly (unplugged, etc.)
        disconnectColumn(i);
      }
    }
  }

  if("serial" in navigator){
    navigator.serial.addEventListener("disconnect", function(e){
      state.columns.forEach(function(col, i){
        if(col.port === e.target){ disconnectColumn(i); }
      });
    });
  }

  /* ---------------------------------------------------------------------
   * Sending
   * ------------------------------------------------------------------- */
  async function sendText(i, rawText){
    const col = state.columns[i];
    if(!col.connected || !col.writer || !rawText) return;
    let payload = rawText;
    let displaySuffix = "";
    if(col.settings.sendCR){ payload += "\r"; displaySuffix += "\\r"; }
    if(col.settings.sendLF){ payload += "\n"; displaySuffix += "\\n"; }
    const bytes = parseOutgoingText(payload, col.settings.hexEscape, col.settings.keyEscape);
    try{
      await col.writer.write(bytes);
      appendMessage(i, "out", rawText + displaySuffix, bytes);
    } catch(err){
      alert("Send failed: " + err.message);
    }
  }

  async function sendChar(i, inputEl){
    const col = state.columns[i];
    if(!col.connected || !col.writer) return;
    const value = inputEl.value;
    if(!value) return;
    const ch = value.charAt(0);
    const bytes = new TextEncoder().encode(ch);
    try{
      await col.writer.write(bytes);
      appendMessage(i, "out", ch, bytes);
      inputEl.value = value.slice(1);
    } catch(err){
      alert("Send failed: " + err.message);
    }
  }

  /* ---------------------------------------------------------------------
   * Logging to file (accumulated then downloaded on Stop, for broad
   * browser compatibility without extra file-system permission prompts)
   * ------------------------------------------------------------------- */
  function startLogging(i){
    const col = state.columns[i];
    col.logging = true;
    col.logStart = new Date();
    col.logLines = [];
    if(col.settings.logIncludeBuffered){
      col.messages.forEach(function(msg){ logMessage(i, msg); });
    }
    const root = colRoot(i);
    root.querySelector(".log-btn").textContent = "Stop Logging (Save File)";
  }

  function stopLogging(i){
    const col = state.columns[i];
    col.logging = false;
    const root = colRoot(i);
    root.querySelector(".log-btn").textContent = "Start Logging";
    const filename = formatFileTimestamp(col.logStart || new Date()) + "_" + sanitizeFilename(col.settings.label) + ".log";
    const blob = new Blob([col.logLines.join("\n") + (col.logLines.length ? "\n" : "")], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  /* ---------------------------------------------------------------------
   * Column DOM construction + event binding
   * ------------------------------------------------------------------- */
  const template = document.getElementById("columnTemplate");

  function buildColumnDom(i){
    const col = state.columns[i];
    const node = template.content.firstElementChild.cloneNode(true);
    node.setAttribute("data-index", i);
    const s = col.settings;

    node.querySelector(".col-label").value = s.label;
    node.querySelector(".f-baud").value = s.baud;
    node.querySelector(".f-databits").value = String(s.dataBits);
    node.querySelector(".f-stopbits").value = String(s.stopBits);
    node.querySelector(".f-parity").value = s.parity;
    node.querySelector(".f-flow").value = s.flowControl;
    node.querySelector(".options-panel").classList.toggle("open", !!s.optionsOpen);
    node.querySelector(".options-btn").classList.toggle("open", !!s.optionsOpen);

    return node;
  }

  function bindColumnEvents(i){
    const root = colRoot(i);
    const col = state.columns[i];

    function persist(){ saveColumnSettings(i, col.settings); }

    root.querySelector(".col-label").addEventListener("change", function(e){
      col.settings.label = e.target.value || ("Port " + (i + 1));
      persist();
    });
    root.querySelector(".f-baud").addEventListener("change", function(e){
      col.settings.baud = Number(e.target.value) || 9600;
      persist();
    });
    root.querySelector(".f-databits").addEventListener("change", function(e){
      col.settings.dataBits = Number(e.target.value);
      persist();
    });
    root.querySelector(".f-stopbits").addEventListener("change", function(e){
      col.settings.stopBits = Number(e.target.value);
      persist();
    });
    root.querySelector(".f-parity").addEventListener("change", function(e){
      col.settings.parity = e.target.value;
      persist();
    });
    root.querySelector(".f-flow").addEventListener("change", function(e){
      col.settings.flowControl = e.target.value;
      persist();
    });

    root.querySelector(".connect-btn").addEventListener("click", function(){
      if(col.connected) disconnectColumn(i); else connectColumn(i);
    });

    const sendInput = root.querySelector(".send-input");
    root.querySelector(".send-btn").addEventListener("click", function(){
      sendText(i, sendInput.value);
      sendInput.value = "";
      sendInput.focus();
    });
    root.querySelector(".send-char-btn").addEventListener("click", function(){
      sendChar(i, sendInput);
      sendInput.focus();
    });
    sendInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        sendText(i, sendInput.value);
        sendInput.value = "";
      }
    });

    function bindToggle(selector, key, after){
      const btn = root.querySelector(selector);
      btn.classList.toggle("active", !!col.settings[key]);
      btn.addEventListener("click", function(){
        col.settings[key] = !col.settings[key];
        btn.classList.toggle("active", col.settings[key]);
        persist();
        if(after) after();
      });
    }
    bindToggle(".opt-cr", "sendCR");
    bindToggle(".opt-lf", "sendLF");
    bindToggle(".opt-hex", "hexEscape");
    bindToggle(".opt-key", "keyEscape");
    bindToggle(".opt-ts", "showTimestamps", function(){ renderConsole(i); });
    bindToggle(".opt-out", "showOutgoing", function(){ renderConsole(i); });
    bindToggle(".opt-num", "showMsgNum", function(){ renderConsole(i); });
    bindToggle(".log-meta-btn", "logMetadata");
    bindToggle(".log-prior-btn", "logIncludeBuffered");

    root.querySelector(".log-btn").addEventListener("click", function(){
      if(col.logging) stopLogging(i); else startLogging(i);
    });

    root.querySelector(".port-settings-btn").addEventListener("click", function(e){
      const open = root.querySelector(".conn-settings-panel").classList.toggle("open");
      e.currentTarget.classList.toggle("open", open);
    });

    root.querySelector(".options-btn").addEventListener("click", function(e){
      const open = root.querySelector(".options-panel").classList.toggle("open");
      e.currentTarget.classList.toggle("open", open);
      col.settings.optionsOpen = open;
      persist();
    });

    // The hex handle position depends on whether a vertical scrollbar is present.
    if(window.ResizeObserver){
      new ResizeObserver(function(){ updateConsoleLayout(i); }).observe(root.querySelector(".console"));
    }

    root.querySelector(".autoscroll-btn").addEventListener("click", function(){
      col.settings.autoScroll = !col.settings.autoScroll;
      persist();
      updateToolbarButtons(i);
      if(col.settings.autoScroll){
        const consoleEl = root.querySelector(".console");
        consoleEl.scrollTop = consoleEl.scrollHeight;
      }
    });

    root.querySelector(".hexview-btn").addEventListener("click", function(){
      col.settings.hexView = !col.settings.hexView;
      persist();
      updateToolbarButtons(i);
      renderConsole(i);
    });

    bindHexResizer(i);
  }

  // Lets the user drag the handle between the text and hex columns to
  // resize the hex-view pane; width is clamped and persisted per column.
  function bindHexResizer(i){
    const root = colRoot(i);
    const resizer = root.querySelector(".hex-resizer");
    let dragging = false, startX = 0, startWidth = 0;

    function onMouseMove(e){
      if(!dragging) return;
      const delta = startX - e.clientX;
      state.columns[i].settings.hexViewWidth = Math.max(HEX_MIN_WIDTH, Math.min(maxHexWidth(i), startWidth + delta));
      updateConsoleLayout(i);
    }
    function onMouseUp(){
      if(!dragging) return;
      dragging = false;
      resizer.classList.remove("dragging");
      document.body.style.cursor = "";
      saveColumnSettings(i, state.columns[i].settings);
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", onMouseUp);
    }
    resizer.addEventListener("mousedown", function(e){
      dragging = true;
      startX = e.clientX;
      startWidth = effectiveHexWidth(i);
      resizer.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      document.addEventListener("mousemove", onMouseMove);
      document.addEventListener("mouseup", onMouseUp);
      e.preventDefault();
    });
  }

  function renderColumns(){
    const container = document.getElementById("columnsContainer");
    container.style.gridTemplateColumns = "repeat(" + state.columns.length + ", minmax(320px, 1fr))";
    container.innerHTML = "";
    state.columns.forEach(function(_, i){
      container.appendChild(buildColumnDom(i));
    });
    state.columns.forEach(function(_, i){
      bindColumnEvents(i);
      updateColumnUI(i);
      updateToolbarButtons(i);
      renderConsole(i);
    });
  }

  async function setNumColumns(n){
    n = Math.max(1, Math.min(MAX_COLUMNS, Math.round(n) || 1));
    for(let idx = n; idx < state.columns.length; idx++){
      if(state.columns[idx] && state.columns[idx].connected){
        await disconnectColumn(idx);
      }
    }
    const newCols = [];
    for(let idx = 0; idx < n; idx++){
      newCols.push(state.columns[idx] || createColumnState(idx));
    }
    state.columns = newCols;
    global.numColumns = n;
    saveGlobalSettings();
    renderColumns();
  }

  /* ---------------------------------------------------------------------
   * Global settings modal
   * ------------------------------------------------------------------- */
  const overlay = document.getElementById("globalSettingsOverlay");
  function openGlobalSettings(){
    document.getElementById("g-ts-format").value = global.tsFormat;
    document.getElementById("g-buffer-size").value = global.bufferSize;
    document.getElementById("g-num-columns").value = global.numColumns;
    overlay.classList.remove("hidden");
  }
  function closeGlobalSettings(){ overlay.classList.add("hidden"); }

  document.getElementById("globalSettingsBtn").addEventListener("click", openGlobalSettings);
  document.getElementById("globalSettingsClose").addEventListener("click", closeGlobalSettings);
  overlay.addEventListener("click", function(e){ if(e.target === overlay) closeGlobalSettings(); });

  document.getElementById("g-ts-format").addEventListener("change", function(e){
    global.tsFormat = e.target.value;
    saveGlobalSettings();
    renderAllConsoles();
  });
  document.getElementById("g-buffer-size").addEventListener("change", function(e){
    const v = Math.max(10, Math.min(20000, Number(e.target.value) || 500));
    global.bufferSize = v;
    e.target.value = v;
    saveGlobalSettings();
    state.columns.forEach(function(col, i){
      while(col.messages.length > global.bufferSize) col.messages.shift();
      renderConsole(i);
    });
  });
  document.getElementById("g-num-columns").addEventListener("change", function(e){
    setNumColumns(Number(e.target.value));
  });

  document.getElementById("darkModeToggle").addEventListener("click", function(){
    global.darkMode = !global.darkMode;
    saveGlobalSettings();
    applyTheme();
  });

  /* ---------------------------------------------------------------------
   * Init
   * ------------------------------------------------------------------- */
  applyTheme();
  if(!("serial" in navigator)){
    document.getElementById("supportHint").textContent =
      "⚠️ Web Serial API not detected in this browser. Open this page in Chrome or Edge (desktop) over HTTPS or localhost.";
  }
  for(let i = 0; i < global.numColumns; i++){
    state.columns.push(createColumnState(i));
  }
  renderColumns();
})();
</script>
</body>
</html>
